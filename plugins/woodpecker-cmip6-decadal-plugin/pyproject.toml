[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roocs-woodpecker-cmip6-decadal-plugin"
version = "0.7.1"
description = "External plugin providing CMIP6 decadal fixes for Woodpecker"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "roocs-woodpecker>=0.7,<0.8",
  "xarray>=2024.1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.entry-points."woodpecker.plugins"]
cmip6_decadal = "woodpecker_cmip6_decadal_plugin"

[project.urls]
Documentation = "https://roocs.github.io/woodpecker/plugins/"
Issues = "https://github.com/roocs/woodpecker/issues"
Repository = "https://github.com/roocs/woodpecker"

[tool.setuptools.packages.find]
where = ["src"]
include = ["woodpecker_cmip6_decadal_plugin*"]

[tool.setuptools.package-data]
woodpecker_cmip6_decadal_plugin = ["recipes/*.json", "recipes/*.yaml", "recipes/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
